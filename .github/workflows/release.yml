name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            cross build --release --target ${{ matrix.target }} -p mkt-cli
          else
            cargo build --release --target ${{ matrix.target }} -p mkt-cli
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/mkt.exe dist/
            cd dist && 7z a mkt-${{ matrix.target }}.zip mkt.exe
          else
            cp target/${{ matrix.target }}/release/mkt dist/
            cd dist && tar czf mkt-${{ matrix.target }}.tar.gz mkt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mkt-${{ matrix.target }}
          path: dist/mkt-*

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*

  crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): each crate must list this repo + workflow
    # in its crates.io Settings -> Trusted Publishing. No stored tokens.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in mkt-cli-core mkt-meta mkt-google mkt-tiktok mkt-linkedin mkt-cli; do
            if curl -fsSL "https://crates.io/api/v1/crates/${crate}/${version}" \
                 -H "User-Agent: mkt-release-workflow" | grep -q '"num"'; then
              echo "${crate} ${version} already on crates.io, skipping"
              continue
            fi
            cargo publish -p "${crate}" --locked
          done
