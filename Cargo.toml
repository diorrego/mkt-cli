[workspace]
resolver = "3"
members = [
    "crates/mkt-core",
    "crates/mkt-cli",
    "crates/mkt-meta",
    "crates/mkt-google",
    "crates/mkt-tiktok",
    "crates/mkt-linkedin",
    "crates/mkt-testkit",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diorrego/mkt-cli"
homepage = "https://mktcli.com"
keywords = ["marketing", "ads", "cli", "meta", "google-ads"]
categories = ["command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = [
    "json", "multipart", "rustls-tls", "gzip", "brotli",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"

# MCP (Model Context Protocol) server
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }

# Date / time
chrono = { version = "0.4", features = ["serde"] }

# Table output
comfy-table = "7"

# CSV
csv = "1"

# Utilities
url = { version = "2", features = ["serde"] }
secrecy = { version = "0.10", features = ["serde"] }
dirs = "6"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"

# Testing
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["yaml", "json", "redactions"] }
mockall = "0.13"
tokio-test = "0.4"
test-case = "3"
fake = { version = "3", features = ["derive", "chrono"] }
proptest = "1"
